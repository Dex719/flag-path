<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flag!Flag!Flag!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Unbounded:wght@600;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="intro">
      <h1>Захвати все пять флагов!</h1>
      <p>Реши задание и введи ответ в формате <code>CTF{...}</code>.</p>
    </header>

    <section class="trail" id="trail" aria-label="Путь из пяти флагов">
      <svg class="trail-svg" id="trail-svg" aria-hidden="true"></svg>
      <!-- станции генерируются из app.js -->
    </section>

    <footer class="outro">
      <p class="progress" id="progress" aria-live="polite">0 / 5</p>

      <div class="victory" id="victory" hidden>
        <p class="victory-title">Все пять флагов захвачены!</p>
      </div>

      <button type="button" class="reset" id="reset">сбросить прогресс</button>
    </footer>
  </main>

  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

  <template id="station-tpl">
    <article class="station">
      <div class="flag-col">
        <div class="flag-wrap">
          <svg class="flag" viewBox="0 0 200 260" aria-hidden="true">
            <defs>
              <!-- id проставляется из app.js: шаблон клонируется на каждый флаг -->
              <clipPath class="flag-clip"><path class="flag-clip-shape" d="M0,0Z"/></clipPath>
            </defs>
            <g class="fabric">
              <g class="fabric-red">
                <polygon class="flag-tail" points="78,46 196,46 160,83 196,121 78,121"/>
                <polygon class="flag-fold" points="78,95 127,95 78,121"/>
                <rect class="flag-main" x="5" y="21" width="122" height="74"/>
              </g>
              <g class="fabric-green">
                <polygon class="flag-tail" points="78,46 196,46 160,83 196,121 78,121"/>
                <polygon class="flag-fold" points="78,95 127,95 78,121"/>
                <rect class="flag-main" x="5" y="21" width="122" height="74"/>
              </g>
              <text class="flag-num" x="68" y="60"></text>
            </g>
            <rect class="flag-pole" x="5" y="12" width="10" height="246" rx="5"/>
            <circle class="flag-pole" cx="10" cy="12" r="9"/>
          </svg>
          <span class="base"></span>
        </div>
      </div>

      <div class="card">
        <p class="card-kicker"></p>
        <h2 class="card-title"></h2>
        <p class="card-text"></p>
        <p class="card-format">Формат: <code></code></p>
        <form class="answer" autocomplete="off" novalidate>
          <label class="sr-only"></label>
          <input type="text" name="flag" placeholder="CTF{...}" spellcheck="false" autocapitalize="off">
          <button type="submit">Проверить</button>
        </form>
        <p class="status" aria-live="polite"></p>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
